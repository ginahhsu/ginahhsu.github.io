  function b64ToBytes(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  }

  async function tryDecrypt(password) {
    const enc = new TextEncoder();
    const salt = b64ToBytes(ENCRYPTED.salt);
    const iv = b64ToBytes(ENCRYPTED.iv);
    const ciphertext = b64ToBytes(ENCRYPTED.ciphertext);
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ENCRYPTED.iterations, hash: 'SHA-256' },
      baseKey,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new TextDecoder().decode(plainBuf);
  }

  const SESSION_KEY = 'cs-seatselection-unlocked';

  function reveal(html) {
    document.getElementById('cs-gate').hidden = true;
    const main = document.getElementById('cs-main-content');
    main.innerHTML = html;
    main.hidden = false;
    if (window.buildCaseStudyTOC) window.buildCaseStudyTOC();
  }

  (function init() {
    const cached = sessionStorage.getItem(SESSION_KEY);
    if (cached) {
      reveal(cached);
      return;
    }
    const form = document.getElementById('cs-gate-form');
    const input = document.getElementById('cs-gate-password');
    const error = document.getElementById('cs-gate-error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      const submitBtn = form.querySelector('button');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';
      try {
        const html = await tryDecrypt(input.value);
        sessionStorage.setItem(SESSION_KEY, html);
        reveal(html);
      } catch (err) {
        error.textContent = 'Incorrect password — try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock';
        input.select();
      }
    });
  })();
</script>
