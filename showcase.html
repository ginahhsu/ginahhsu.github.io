<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase — Gina Hsu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Roboto:wght@400;500&display=swap');

  :root {
    --ink: rgb(48, 30, 24);
    --bg: rgb(249, 224, 214);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: Roboto, "Roboto Placeholder", sans-serif;
    color: var(--ink);
  }

  /* ---- Chrome ---- */
  .showcase-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 28px;
    z-index: 10;
  }

  .showcase-title {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(253, 251, 248, 0.85);
    padding: 10px 16px;
    border-radius: 100px;
  }

  .showcase-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 100px;
    background: rgba(253, 251, 248, 0.85);
    text-decoration: none;
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    transition: background-color 0.2s ease;
  }

  .showcase-close:hover { background: rgb(253, 251, 248); }

  /* ---- Bottom-left label ---- */
  .showcase-label {
    position: fixed;
    left: 28px;
    bottom: 26px;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .showcase-label-title {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 800;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.01em;
  }

  .showcase-label-count {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 700;
    font-size: 14px;
    opacity: 0.55;
  }

  .showcase-label-sub {
    position: absolute;
    left: 1px;
    top: 100%;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0.55;
    white-space: nowrap;
  }

  @media (max-width: 520px) {
    .showcase-label-title { font-size: 28px; }
  }

  /* ---- Stage ---- */
  .showcase-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: stretch;
    padding: 100px 32px;
  }

  /* ---- Grid view (balanced masonry, no cropping) ---- */
  #showcaseGrid {
    display: flex;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    gap: 10px;
    padding-bottom: 8px;
  }

  .showcase-grid-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1 1 0;
    min-width: 0;
  }

  .showcase-grid-item {
    display: block;
    border-radius: 8px;
    overflow: hidden;
    cursor: zoom-in;
    background: rgba(48, 30, 24, 0.06);
    text-decoration: none;
    transition: opacity 0.35s ease, filter 0.35s ease;
  }

  .showcase-grid-item img {
    width: 100%;
    height: auto;
    display: block;
  }

  @media (max-width: 720px) {
    #showcaseGrid { gap: 8px; }
    .showcase-grid-col { gap: 8px; }
  }

  @media (max-width: 520px) {
    .showcase-stage { padding: 88px 16px 72px; }
  }

  /* ---- Lightbox ---- */
  .showcase-lightbox {
    position: fixed;
    inset: 0;
    background: rgba(26, 16, 12, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    z-index: 50;
    cursor: zoom-out;
  }

  .showcase-lightbox.is-open { display: flex; }

  .showcase-lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .showcase-lightbox-close {
    position: fixed;
    top: 24px;
    right: 28px;
    width: 40px;
    height: 40px;
    border-radius: 100px;
    background: rgba(253, 251, 248, 0.9);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    line-height: 1;
  }

  .showcase-lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 100px;
    background: rgba(253, 251, 248, 0.9);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }

  .showcase-lightbox-nav.is-hidden { display: none; }

  .showcase-lightbox-prev { left: 24px; }
  .showcase-lightbox-next { right: 24px; }

  @media (max-width: 640px) {
    .showcase-lightbox-nav { width: 40px; height: 40px; font-size: 20px; }
    .showcase-lightbox-prev { left: 12px; }
    .showcase-lightbox-next { right: 12px; }
  }
</style>
</head>
<body>

<div class="showcase-topbar">
  <span class="showcase-title">Showcase</span>
  <a class="showcase-close" href="index.html" aria-label="Close showcase">&times;</a>
</div>

<div class="showcase-stage">
  <div id="showcaseGrid"></div>
</div>

<div class="showcase-label">
  <span class="showcase-label-title">Showcase</span>
  <span class="showcase-label-count" id="showcaseCount"></span>
  <span class="showcase-label-sub" id="showcaseSub"></span>
</div>

<div class="showcase-lightbox" id="showcaseLightbox">
  <span class="showcase-lightbox-close" aria-hidden="true">&times;</span>
  <span class="showcase-lightbox-nav showcase-lightbox-prev" aria-label="Previous image">&#8249;</span>
  <img id="showcaseLightboxImg" src="" alt="">
  <span class="showcase-lightbox-nav showcase-lightbox-next" aria-label="Next image">&#8250;</span>
</div>

<script>
  // Placeholder tiles - swap in finished project work here. Labels are
  // generic descriptions of what each image shows, not attributed to Gina;
  // see assets/showcase/ for the source files.
  const SHOWCASE_ITEMS = [
    { image: 'assets/showcase/RmLGB46waMTPCHRdtuZsLbJeBwk.png_width=2880&height=1564.png', label: 'Roots Collective — Website', w: 2880, h: 1564 },
    { image: 'assets/showcase/TFCuPyhS6yHWlRHS7NMhx4YPKXk.png_width=348&height=705.png', label: 'Roots Collective — Mobile', w: 348, h: 705 },
    { image: 'assets/showcase/kUmjYyBa4jskQIC7d2sTH0mJVA.png_width=2880&height=2370.png', label: 'Roots Collective — Mission', w: 2880, h: 2370 },
    { image: 'assets/showcase/pUn5FHYnYc6h4o4iX0bEtbd8yA.png_width=1200&height=2102.png', label: 'Roots Collective — Brand Colours', w: 1200, h: 2102 },
    { image: 'assets/showcase/IlMol5wLEy6Z6decTExOvFDsbY.png_width=1194&height=1229.png', label: 'Lunar New Year Graphic', w: 1194, h: 1229 },
    { image: 'assets/showcase/VyfLq64SUEkk1EWEFHVHSqiEE.jpg_width=2048&height=2048.png', label: 'Mid-Autumn Festival Graphic', w: 2048, h: 2048 },
    { image: 'assets/showcase/2ijv4VMIf76RAnNyt5W92KgjU.jpg_width=1126&height=699.png', label: 'Community Illustration', w: 1126, h: 699 },
    { image: 'assets/showcase/G6ymghRTn5OKyKH93Vcexx9cyDk.jpg_width=1500&height=1200.png', label: 'Beach Hut Illustration', w: 1500, h: 1200 },
    { image: 'assets/showcase/WvBpQOsbv41RGHBebvLYLscit8.jpg_width=2048&height=2048.png', label: 'Colour Palette Study', w: 2048, h: 2048 },
    { image: 'assets/showcase/WNVGKKkXmxZzeJQdCVTuBR9U.jpg_width=3000&height=3301.png', label: 'Workout Infographic', w: 3000, h: 3301 },
    { image: 'assets/showcase/Mk3mbkEfNJGNEwUwlkFP60mk.png_width=2503&height=3000.png', label: "Valentine's Day Infographic", w: 2503, h: 3000 },
    { image: 'assets/showcase/QahiiNZfbynQWoxXvDIB9Z7BM.jpg_width=3000&height=3301.png', label: 'Cookie Recipe Card', w: 3000, h: 3301 },
    { image: 'assets/showcase/RNZ9hon5n97tWl8vVPfJYTE4hig.jpg_width=1125&height=1940.png', label: 'Fan Art', w: 1125, h: 1940 }
  ];

  const lightbox = document.getElementById('showcaseLightbox');
  const lightboxImg = document.getElementById('showcaseLightboxImg');
  const prevBtn = document.querySelector('.showcase-lightbox-prev');
  const nextBtn = document.querySelector('.showcase-lightbox-next');
  const closeBtn = document.querySelector('.showcase-lightbox-close');

  let currentIndex = 0;

  function showImage(index) {
    currentIndex = (index + SHOWCASE_ITEMS.length) % SHOWCASE_ITEMS.length;
    const item = SHOWCASE_ITEMS[currentIndex];
    lightboxImg.src = item.image;
    lightboxImg.alt = item.label;
  }

  function openLightbox(index) {
    showImage(index);
    lightbox.classList.add('is-open');
    document.body.classList.add('lightbox-open');
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    lightboxImg.src = '';
    document.body.classList.remove('lightbox-open');
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === prevBtn || e.target === nextBtn) return;
    closeLightbox();
  });

  prevBtn.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex - 1); });
  nextBtn.addEventListener('click', (e) => { e.stopPropagation(); showImage(currentIndex + 1); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('is-open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') showImage(currentIndex - 1);
    if (e.key === 'ArrowRight') showImage(currentIndex + 1);
  });

  // ---- Grid view: balanced masonry (each image keeps its own aspect ratio,
  // no cropping) packed by always adding the next image to the shortest
  // column, plus a cursor-driven spotlight that dims columns away from it.
  const grid = document.getElementById('showcaseGrid');

  function getGridColumnCount() {
    const w = window.innerWidth;
    if (w <= 520) return 2;
    if (w <= 720) return 3;
    if (w <= 1100) return 4;
    return 6;
  }

  let gridColumnCount = null;

  function buildGrid() {
    const count = getGridColumnCount();
    if (count === gridColumnCount) return;
    gridColumnCount = count;
    grid.innerHTML = '';

    const cols = [];
    const heights = new Array(count).fill(0);
    for (let c = 0; c < count; c++) {
      const col = document.createElement('div');
      col.className = 'showcase-grid-col';
      grid.appendChild(col);
      cols.push(col);
    }

    SHOWCASE_ITEMS.forEach((item, i) => {
      let shortest = 0;
      for (let c = 1; c < count; c++) {
        if (heights[c] < heights[shortest]) shortest = c;
      }
      heights[shortest] += item.h / item.w;

      const tile = document.createElement('a');
      tile.className = 'showcase-grid-item';
      tile.href = '#';
      tile.dataset.col = shortest;
      tile.setAttribute('aria-label', item.label);
      tile.addEventListener('click', (e) => {
        e.preventDefault();
        openLightbox(i);
      });

      const img = document.createElement('img');
      img.src = item.image;
      img.alt = item.label;
      img.loading = 'lazy';
      tile.appendChild(img);

      cols[shortest].appendChild(tile);
    });
  }

  buildGrid();
  window.addEventListener('resize', buildGrid);

  grid.addEventListener('pointermove', (e) => {
    const rect = grid.getBoundingClientRect();
    const colWidth = rect.width / gridColumnCount;
    const hoveredCol = Math.floor((e.clientX - rect.left) / colWidth);
    grid.querySelectorAll('.showcase-grid-item').forEach((tile) => {
      const dist = Math.abs(Number(tile.dataset.col) - hoveredCol);
      const t = Math.min(dist / 2, 1);
      tile.style.opacity = String(1 - t * 0.65);
      tile.style.filter = t > 0 ? `grayscale(${t})` : '';
    });
  });

  grid.addEventListener('pointerleave', () => {
    grid.querySelectorAll('.showcase-grid-item').forEach((tile) => {
      tile.style.opacity = '';
      tile.style.filter = '';
    });
  });

  document.getElementById('showcaseCount').textContent = `(${SHOWCASE_ITEMS.length})`;
  document.getElementById('showcaseSub').textContent = `/${SHOWCASE_ITEMS.length} Photos`;
</script>

</body>
</html>
