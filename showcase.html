<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase — Gina Hsu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&family=Roboto:wght@400;500;600&display=swap');

  :root {
    --bg: #15100c;
    --ink: #f5ece3;
    --ink-dim: rgba(245, 236, 227, 0.55);
    --ink-faint: rgba(245, 236, 227, 0.3);
    --accent: #ef7a5a;
    --tile-bg: #241a14;
    --tile-border: rgba(245, 236, 227, 0.12);
    --panel-bg: #1a1410;
    --chip-bg: rgba(245, 236, 227, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: Roboto, "Roboto Placeholder", sans-serif;
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---- Chrome ---- */
  .showcase-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 28px;
    z-index: 20;
    pointer-events: none;
  }

  .showcase-title {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--chip-bg);
    border: 1px solid var(--tile-border);
    padding: 10px 16px;
    border-radius: 100px;
    pointer-events: auto;
  }

  .showcase-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 100px;
    background: var(--chip-bg);
    border: 1px solid var(--tile-border);
    text-decoration: none;
    color: var(--ink);
    font-size: 20px;
    line-height: 1;
    transition: background-color 0.2s ease;
    pointer-events: auto;
  }

  .showcase-close:hover { background: rgba(245, 236, 227, 0.16); }

  .showcase-count {
    position: fixed;
    left: 28px;
    bottom: 26px;
    z-index: 20;
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink-faint);
    pointer-events: none;
  }

  .showcase-hint {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 100px;
    background: var(--chip-bg);
    border: 1px solid var(--tile-border);
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .showcase-hint.is-hidden { opacity: 0; }

  .showcase-hint .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ---- Endless canvas ---- */
  .showcase-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }

  .showcase-viewport.is-dragging { cursor: grabbing; }

  .tile {
    position: absolute;
    width: 190px;
    display: block;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }

  .tile-frame {
    width: 190px;
    height: 162px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    transform: scale(1);
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease;
  }

  .tile:hover .tile-frame {
    transform: scale(1.035);
    border-color: rgba(245, 236, 227, 0.3);
  }

  .tile-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    -webkit-user-drag: none;
  }

  .tile-caption {
    padding-top: 10px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .tile:hover .tile-caption {
    opacity: 1;
    transform: translateY(0);
  }

  .tile-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .tile-tag span {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--accent);
    white-space: nowrap;
  }

  .tile-tag i {
    flex: 1;
    height: 1px;
    background: var(--accent);
    opacity: 0.35;
  }

  .tile-label {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0;
  }

  /* ---- Center title (part of the canvas, pans with it) ---- */
  .showcase-canvas-title {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
    pointer-events: none;
  }

  .showcase-canvas-title .eyebrow {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .showcase-canvas-title h1 {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 800;
    font-size: 34px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .showcase-canvas-title .sub {
    font-size: 13px;
    color: var(--ink-dim);
    max-width: 240px;
  }

  @media (max-width: 520px) {
    .showcase-canvas-title h1 { font-size: 26px; }
  }

  /* ---- Detail panel ---- */
  .showcase-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 7, 5, 0.55);
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }

  .showcase-backdrop.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .showcase-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 41;
    width: min(480px, 92vw);
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border-left: 1px solid var(--tile-border);
    box-shadow: -8px 0 48px rgba(0, 0, 0, 0.35);
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    -webkit-user-select: text;
    user-select: text;
  }

  .showcase-panel.is-open { transform: translateX(0); }

  .showcase-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 28px 0;
  }

  .showcase-panel-tag {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .showcase-panel-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 100px;
    background: var(--chip-bg);
    border: 1px solid var(--tile-border);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .showcase-panel-close:hover { background: rgba(245, 236, 227, 0.16); }

  .showcase-panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 28px 28px;
  }

  .showcase-panel-body h2 {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.2;
    margin: 0 0 18px;
  }

  .showcase-panel-image {
    width: 100%;
    max-height: 55vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 8px;
    overflow: hidden;
    padding: 12px;
  }

  .showcase-panel-image img {
    max-width: 100%;
    max-height: 50vh;
    object-fit: contain;
    display: block;
    border-radius: 2px;
  }

  .showcase-panel-desc {
    margin: 18px 0 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-dim);
  }

  .showcase-panel-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-top: 1px solid var(--tile-border);
  }

  .showcase-panel-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 100px;
    background: var(--chip-bg);
    border: 1px solid var(--tile-border);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .showcase-panel-nav:hover { background: rgba(245, 236, 227, 0.16); }

  .showcase-panel-counter {
    font-family: Raleway, "Raleway Placeholder", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
  }

  @media (max-width: 520px) {
    .showcase-panel-head, .showcase-panel-body, .showcase-panel-foot { padding-left: 20px; padding-right: 20px; }
  }
</style>

</head>
<body>

<div class="showcase-topbar">
  <span class="showcase-title">Showcase</span>
  <a class="showcase-close" href="index.html" aria-label="Close showcase">&times;</a>
</div>

<div class="showcase-viewport" id="showcaseViewport"></div>

<span class="showcase-count" id="showcaseCount"></span>

<div class="showcase-hint" id="showcaseHint">
  <span class="dot"></span>
  <span>Drag to explore</span>
</div>

<div class="showcase-backdrop" id="showcaseBackdrop"></div>
<div class="showcase-panel" id="showcasePanel" role="dialog" aria-modal="true">
  <div class="showcase-panel-head">
    <span class="showcase-panel-tag" id="panelTag"></span>
    <span class="showcase-panel-close" id="panelClose" aria-label="Close">&times;</span>
  </div>
  <div class="showcase-panel-body">
    <h2 id="panelTitle"></h2>
    <div class="showcase-panel-image">
      <img id="panelImage" src="" alt="">
    </div>
    <p class="showcase-panel-desc" id="panelDesc" hidden></p>
  </div>
  <div class="showcase-panel-foot">
    <span class="showcase-panel-nav" id="panelPrev" aria-label="Previous">&#8249;</span>
    <span class="showcase-panel-counter" id="panelCounter"></span>
    <span class="showcase-panel-nav" id="panelNext" aria-label="Next">&#8250;</span>
  </div>
</div>

<script>
  // Placeholder tiles - swap in finished project work here. Labels are
  // generic descriptions of what each image shows, not attributed to Gina;
  // see assets/showcase/ for the source files. `desc` is optional and only
  // renders in the detail panel when present.
  const SHOWCASE_ITEMS = [
    { image: 'assets/showcase/RmLGB46waMTPCHRdtuZsLbJeBwk.png_width=2880&height=1564.png', tag: 'ROOTS COLLECTIVE', title: 'Website' },
    { image: 'assets/showcase/TFCuPyhS6yHWlRHS7NMhx4YPKXk.png_width=348&height=705.png', tag: 'ROOTS COLLECTIVE', title: 'Mobile' },
    { image: 'assets/showcase/kUmjYyBa4jskQIC7d2sTH0mJVA.png_width=2880&height=2370.png', tag: 'ROOTS COLLECTIVE', title: 'Mission' },
    { image: 'assets/showcase/pUn5FHYnYc6h4o4iX0bEtbd8yA.png_width=1200&height=2102.png', tag: 'ROOTS COLLECTIVE', title: 'Brand Colours' },
    { image: 'assets/showcase/IlMol5wLEy6Z6decTExOvFDsbY.png_width=1194&height=1229.png', tag: 'ILLUSTRATION', title: 'Lunar New Year Graphic' },
    { image: 'assets/showcase/VyfLq64SUEkk1EWEFHVHSqiEE.jpg_width=2048&height=2048.png', tag: 'ILLUSTRATION', title: 'Mid-Autumn Festival Graphic' },
    { image: 'assets/showcase/2ijv4VMIf76RAnNyt5W92KgjU.jpg_width=1126&height=699.png', tag: 'ILLUSTRATION', title: 'Community Illustration' },
    { image: 'assets/showcase/G6ymghRTn5OKyKH93Vcexx9cyDk.jpg_width=1500&height=1200.png', tag: 'ILLUSTRATION', title: 'Beach Hut Illustration' },
    { image: 'assets/showcase/WvBpQOsbv41RGHBebvLYLscit8.jpg_width=2048&height=2048.png', tag: 'STUDY', title: 'Colour Palette Study' },
    { image: 'assets/showcase/WNVGKKkXmxZzeJQdCVTuBR9U.jpg_width=3000&height=3301.png', tag: 'INFOGRAPHIC', title: 'Workout Infographic' },
    { image: 'assets/showcase/Mk3mbkEfNJGNEwUwlkFP60mk.png_width=2503&height=3000.png', tag: 'INFOGRAPHIC', title: "Valentine's Day Infographic" },
    { image: 'assets/showcase/QahiiNZfbynQWoxXvDIB9Z7BM.jpg_width=3000&height=3301.png', tag: 'RECIPE CARD', title: 'Cookie Recipe Card' },
    { image: 'assets/showcase/RNZ9hon5n97tWl8vVPfJYTE4hig.jpg_width=1125&height=1940.png', tag: 'ART', title: 'Fan Art' }
  ];

  const N = SHOWCASE_ITEMS.length;
  document.getElementById('showcaseCount').textContent = `${N} pieces`;

  // ---- Endless canvas: a uniform grid of tiles is virtualized around the
  // current pan offset, cycling through SHOWCASE_ITEMS. A single title block
  // sits at the world origin (0,0) and pans with everything else, with a
  // matching rectangle of cells left empty behind it.
  const viewport = document.getElementById('showcaseViewport');

  const TILE_W = 190, TILE_IMG_H = 162, TILE_H = 212, GAP = 54;
  const PITCH_X = TILE_W + GAP;
  const PITCH_Y = TILE_H + GAP;
  const TITLE_HALF_W = 155, TITLE_HALF_H = 65;

  let offsetX = 0, offsetY = 0;
  let vx = 0, vy = 0;
  let dragging = false, dragMoved = 0, lastPX = 0, lastPY = 0, lastT = 0;
  let momentumId = null;

  const tileNodes = new Map();

  function mod(n, m) { return ((n % m) + m) % m; }

  const titleBlock = document.createElement('div');
  titleBlock.className = 'showcase-canvas-title';
  titleBlock.innerHTML = `
    <span class="eyebrow">Showcase</span>
    <h1>Selected&nbsp;Work</h1>
    <span class="sub">Projects, illustrations &amp; explorations</span>
  `;
  viewport.appendChild(titleBlock);

  function makeTile(idx) {
    const item = SHOWCASE_ITEMS[idx];
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.idx = idx;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', item.title);
    el.innerHTML = `
      <div class="tile-frame"><img src="${item.image}" alt="${item.title}" loading="lazy" draggable="false"></div>
      <div class="tile-caption">
        <div class="tile-tag"><span>${item.tag}</span><i></i></div>
        <p class="tile-label">${item.title}</p>
      </div>
    `;
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPanel(idx); }
    });
    return el;
  }

  function rectsIntersect(ax0, ay0, ax1, ay1, bx0, by0, bx1, by1) {
    return ax0 < bx1 && ax1 > bx0 && ay0 < by1 && ay1 > by0;
  }

  function renderVisibleCells() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const cx = vw / 2 + offsetX, cy = vh / 2 + offsetY;
    const buffer = 1;

    const colMin = Math.floor((-cx) / PITCH_X) - buffer;
    const colMax = Math.ceil((vw - cx) / PITCH_X) + buffer;
    const rowMin = Math.floor((-cy) / PITCH_Y) - buffer;
    const rowMax = Math.ceil((vh - cy) / PITCH_Y) + buffer;

    const needed = new Set();

    for (let row = rowMin; row <= rowMax; row++) {
      for (let col = colMin; col <= colMax; col++) {
        const worldX = col * PITCH_X, worldY = row * PITCH_Y;
        const overlapsTitle = rectsIntersect(
          worldX - TILE_W / 2, worldY - TILE_H / 2, worldX + TILE_W / 2, worldY + TILE_H / 2,
          -TITLE_HALF_W, -TITLE_HALF_H, TITLE_HALF_W, TITLE_HALF_H
        );
        if (overlapsTitle) continue;

        const key = col + ',' + row;
        needed.add(key);

        let node = tileNodes.get(key);
        if (!node) {
          const idx = mod(row * 5 + col * 3, N);
          node = makeTile(idx);
          viewport.appendChild(node);
          tileNodes.set(key, node);
        }
        node.style.left = (cx + worldX - TILE_W / 2) + 'px';
        node.style.top = (cy + worldY - TILE_IMG_H / 2) + 'px';
      }
    }

    for (const [key, node] of tileNodes) {
      if (!needed.has(key)) {
        node.remove();
        tileNodes.delete(key);
      }
    }

    titleBlock.style.left = (cx - TITLE_HALF_W) + 'px';
    titleBlock.style.top = (cy - TITLE_HALF_H) + 'px';
    titleBlock.style.width = (TITLE_HALF_W * 2) + 'px';
  }

  function cancelMomentum() {
    if (momentumId) { cancelAnimationFrame(momentumId); momentumId = null; }
  }

  function startMomentum() {
    cancelMomentum();
    function tick() {
      vx *= 0.94; vy *= 0.94;
      offsetX += vx; offsetY += vy;
      renderVisibleCells();
      if (Math.abs(vx) + Math.abs(vy) > 0.05) {
        momentumId = requestAnimationFrame(tick);
      } else {
        momentumId = null;
      }
    }
    momentumId = requestAnimationFrame(tick);
  }

  const hint = document.getElementById('showcaseHint');
  let hintDismissed = false;

  viewport.addEventListener('pointerdown', (e) => {
    dragging = true;
    dragMoved = 0;
    lastPX = e.clientX; lastPY = e.clientY; lastT = performance.now();
    vx = 0; vy = 0;
    cancelMomentum();
    viewport.setPointerCapture(e.pointerId);
    viewport.classList.add('is-dragging');
  });

  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
    offsetX += dx; offsetY += dy;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    const now = performance.now();
    const dt = Math.max(now - lastT, 1);
    vx = dx / dt * 16; vy = dy / dt * 16;
    lastPX = e.clientX; lastPY = e.clientY; lastT = now;
    if (!hintDismissed && dragMoved > 20) {
      hintDismissed = true;
      hint.classList.add('is-hidden');
    }
    renderVisibleCells();
  });

  viewport.addEventListener('pointerup', (e) => {
    dragging = false;
    viewport.classList.remove('is-dragging');
    if (dragMoved < 6) {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const tile = hit && hit.closest('.tile');
      if (tile) openPanel(Number(tile.dataset.idx));
    } else {
      startMomentum();
    }
  });

  viewport.addEventListener('pointercancel', () => {
    dragging = false;
    viewport.classList.remove('is-dragging');
  });

  window.addEventListener('resize', renderVisibleCells);

  renderVisibleCells();

  // ---- Detail panel ----
  const backdrop = document.getElementById('showcaseBackdrop');
  const panel = document.getElementById('showcasePanel');
  const panelTag = document.getElementById('panelTag');
  const panelTitle = document.getElementById('panelTitle');
  const panelImage = document.getElementById('panelImage');
  const panelDesc = document.getElementById('panelDesc');
  const panelCounter = document.getElementById('panelCounter');

  let currentPanelIndex = 0;

  function openPanel(idx) {
    currentPanelIndex = mod(idx, N);
    const item = SHOWCASE_ITEMS[currentPanelIndex];
    panelTag.textContent = item.tag;
    panelTitle.textContent = item.title;
    panelImage.src = item.image;
    panelImage.alt = item.title;
    if (item.desc) {
      panelDesc.textContent = item.desc;
      panelDesc.hidden = false;
    } else {
      panelDesc.hidden = true;
    }
    panelCounter.textContent = `${currentPanelIndex + 1} / ${N}`;
    backdrop.classList.add('is-open');
    panel.classList.add('is-open');
  }

  function closePanel() {
    backdrop.classList.remove('is-open');
    panel.classList.remove('is-open');
  }

  document.getElementById('panelClose').addEventListener('click', closePanel);
  backdrop.addEventListener('click', closePanel);
  document.getElementById('panelPrev').addEventListener('click', () => openPanel(currentPanelIndex - 1));
  document.getElementById('panelNext').addEventListener('click', () => openPanel(currentPanelIndex + 1));

  document.addEventListener('keydown', (e) => {
    if (!panel.classList.contains('is-open')) return;
    if (e.key === 'Escape') closePanel();
    if (e.key === 'ArrowLeft') openPanel(currentPanelIndex - 1);
    if (e.key === 'ArrowRight') openPanel(currentPanelIndex + 1);
  });
</script>

</body>
